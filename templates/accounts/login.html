{% extends "base.html" %}
{% block title %}Entrar | TaskFlow{% endblock %}
{% block content %}
<div class="auth-wrap">
    <section class="card auth-card">
        <h1>Entrar</h1>
        <p class="muted">Acesse seus projetos e tarefas.</p>

        <form method="post" class="form-stack">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <label>
                    <span>{{ field.label }}</span>
                    {{ field }}
                    {{ field.errors }}
                </label>
            {% endfor %}
            <button class="button primary" type="submit">Entrar</button>
        </form>

        <p class="small">Ainda não tem conta? <a href="{% url 'accounts:register' %}">Criar conta</a></p>
    </section>
</div>
{% endblock %}
